<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SEPA Course</title>
<link rel="icon" href="icon-128.png">
<style>
  :root{--bg:#F6F8F3;--ink:#16210F;--muted:#5B6472;--card:#fff;--line:#E3E8DC;--green:#3C8C1E}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12160F;--ink:#EEF2EA;--muted:#A9B2A0;--card:#1B2117;--line:#2C3527;--green:#7BC74D}}
  :root[data-theme="dark"]{--bg:#12160F;--ink:#EEF2EA;--muted:#A9B2A0;--card:#1B2117;--line:#2C3527;--green:#7BC74D}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:440px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;text-align:center}
  h1{display:flex;justify-content:center;align-items:center;gap:.3em;margin:0 0 8px;font-size:30px;letter-spacing:-.01em;text-transform:uppercase}
  h1 img{width:1.15em;height:1.15em}
  p{margin:8px 0;color:var(--muted)}
</style>
</head>
<body data-api="https://script.google.com/macros/s/AKfycbwXP19MdxRh9IwkalaEZUaDgw4e5LEHxGG6e5J4bpDW3TDkTA-8FY7LVIeTnFxFgyhN/exec">
