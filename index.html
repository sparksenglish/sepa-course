/* Layout: a mobile-first content library. Home = hero carousel + rows of notched cards per unit; unit pages list sections; routine pages are reading pages with expandable phrase cards. Bottom bar: search + nav. */
:root{
  --bg:#F6F7F0; --surface:#FFFFFF; --ink:#16210F; --muted:#5B6853; --line:#E1E5D5;
  --green:#3FA535; --deep:#1E5C1A; --on-deep:#FFFFFF; --yellow:#FCD535; --ysoft:#FFF5C9; --on-y:#16210F;
  --u1:#2E8F29; --u2:#E0A800; --u3:#2F6FB5; --u4:#1F98AD; --u5:#1E5C1A; --u6:#24427A;
  --ls:#E0A800; --sk:#3FA535; --st:#2F6FB5; --sp:#1F98AD;
  --bad:#C2412D; --good:#2D8A27;
  --nL:#0E7C86; --nI:#7B4BB7; --nP:#2D8A27; --nM:#C2412D; --nS:#2F6FB5; --nX:#6B6F66;
  --nav:#16210F; --on-nav:#FFFFFF; --shadow:0 12px 30px -16px rgba(30,60,20,.35);
  --tint:22%; --shade:0%;
  --f-display:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10150E; --surface:#1A2117; --ink:#ECF1E6; --muted:#A2AE9A; --line:#2D3829;
  --green:#5BC94F; --deep:#2E8F29; --on-deep:#FFFFFF; --yellow:#FCD535; --ysoft:#3A3315; --on-y:#16210F;
  --u1:#4DB846; --u2:#F2BE1E; --u3:#6FA2E6; --u4:#45C2D6; --u5:#7AD86E; --u6:#8FA9E6;
  --ls:#F6C324; --sk:#5BC94F; --st:#76A9EA; --sp:#4FC7DA; --bad:#F07A63; --good:#7AD86E;
  --nL:#5FCBD3; --nI:#B999E8; --nP:#7AD86E; --nM:#F07A63; --nS:#76A9EA; --nX:#B4B8AE;
  --nav:#ECF1E6; --on-nav:#10150E; --shadow:0 12px 30px -16px rgba(0,0,0,.7); --tint:28%; --shade:45%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10150E; --surface:#1A2117; --ink:#ECF1E6; --muted:#A2AE9A; --line:#2D3829;
  --green:#5BC94F; --deep:#2E8F29; --on-deep:#FFFFFF; --yellow:#FCD535; --ysoft:#3A3315; --on-y:#16210F;
  --u1:#4DB846; --u2:#F2BE1E; --u3:#6FA2E6; --u4:#45C2D6; --u5:#7AD86E; --u6:#8FA9E6;

}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--st);outline-offset:2px}
/* routine */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chipbtn{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipbtn .d{width:10px;height:10px;border-radius:50%;background:var(--lc)}
.chipbtn[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:#fff}
.chipbtn[aria-pressed="true"] .d{background:#fff}
.blocktitle{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.phrases{display:flex;flex-direction:column;gap:10px}
.pc{border-radius:20px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden}
.pc[open]{border-color:color-mix(in srgb,var(--u) 60%,var(--line))}
.pc summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 14px 14px 16px}
.pc summary::-webkit-details-marker{display:none}
.pc .n{flex:none;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--u) var(--tint),var(--surface));color:color-mix(in srgb,var(--u) 60%,var(--ink));display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.pc .t{flex:1;min-width:0;font-weight:800;font-size:17px;line-height:1.35}
.pc .more{display:block;font-weight:700;font-size:12.5px;color:var(--muted);margin-top:2px}
.pc .chev{flex:none;transition:transform .2s;color:var(--muted)}
.pc[open] .chev{transform:rotate(180deg)}
.pc .body{padding:0 16px 16px 58px;display:flex;flex-direction:column;gap:12px}
.alts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alts li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.alts li span{flex:1;min-width:0}
.ic{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--ysoft);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ic:hover{background:var(--yellow);color:var(--on-y)}
.ic.star[aria-pressed="true"]{background:var(--yellow);color:var(--on-y)}
.notes{display:flex;flex-direction:column;gap:8px}
.note{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--nc) 12%,var(--surface));font-size:15px}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:2px 0}
.ntag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--nc)}
.ntag i{font-style:normal;width:18px;height:18px;border-radius:6px;background:var(--nc);color:var(--surface);display:grid;place-items:center;font-size:11px}
.hiddennote{font-size:13px;color:var(--muted);font-style:italic}
.watch{border-radius:22px;padding:16px;background:color-mix(in srgb,var(--nM) 10%,var(--surface));display:flex;flex-direction:column;gap:10px}
.watch .w{display:grid;gap:2px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--nM) 35%,transparent)}
.watch .w:first-of-type{border-top:0;padding-top:0}
.wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.right{color:var(--good);font-weight:800}
.act{color:var(--muted);font-style:italic}
.dlg{border-radius:22px;background:color-mix(in srgb,var(--lc) 16%,var(--surface));padding:16px;display:flex;flex-direction:column;gap:8px}
.dlg-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted)}
.ln{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.ln .who{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:var(--lc)}
.ln .bub{background:var(--surface);padding:8px 12px;border-radius:16px 16px 16px 4px;min-width:0}
.ln.s{align-self:flex-end;flex-direction:row-reverse}
.ln.s .who{background:#66725F}
.ln.s .bub{border-radius:16px 16px 4px 16px}
.ln.a{align-self:center;max-width:100%;font-style:italic;color:var(--muted);font-size:14px}
.tipline{font-size:15px;padding:10px 12px;border-radius:14px;background:var(--surface)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer;min-width:0}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.pager b{display:block;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15}
.pager button:hover{border-color:var(--green)}

/* search + saved + about */
.searchbox{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:999px;padding:10px 16px;background:var(--surface)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--ink)}
.result{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;text-align:left;width:100%}
.result:hover{border-color:var(--green)}
.result span{flex:1;min-width:0}
.result .ic{flex:none}
.result small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.result mark{background:var(--ysoft);color:inherit;border-radius:4px;padding:0 2px}
.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:20px;border-radius:20px;border:2px dashed var(--line);color:var(--muted)}
.prose{display:flex;flex-direction:column;gap:14px;max-width:70ch}
.prose h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px}
.prose p,.prose ol{margin:0}
.prose ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lvbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:2px solid transparent;background:color-mix(in srgb,var(--lc) 18%,var(--surface));cursor:pointer;text-align:left}
.lvbtn[aria-pressed="true"]{border-color:var(--lc)}
.lvbtn .dot{flex:none;width:36px;height:36px;border-radius:50%;background:var(--lc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.lvbtn b{display:block;font-weight:800}
.lvbtn small{color:var(--muted)}


/* audio practice */
.ex{padding:0}
.exhead{display:flex;gap:12px;align-items:center;padding:14px 16px 0}
.exhead .n{flex:none;width:auto;min-width:40px;height:30px;padding:0 8px;border-radius:999px}
.exhead h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.15}
.exbody{padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px}
.exbody audio{width:100%;height:44px}
.exlist{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:4px}
.words{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;counter-reset:w}
.words li{counter-increment:w;padding:8px 10px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column}
.words li span:first-child::before{content:counter(w) ". ";color:var(--muted);font-weight:700}
.exlist .ans{display:block;color:var(--good);font-weight:700}
.exlist .ans[hidden],.exbody p.ans[hidden]{display:none}
.exbody p.ans{color:var(--good);font-weight:700}
.exlist u{text-decoration-thickness:2px;text-underline-offset:3px}
.words .ans{color:var(--good);font-weight:800;font-size:14px}
.tablewrap{overflow-x:auto}
.exbody table{border-collapse:collapse;min-width:260px}
.exbody th,.exbody td{border:1px solid var(--line);padding:6px 12px;text-align:left}
.exbody th{background:var(--bg);font-weight:800}
.card[disabled]{cursor:default;opacity:.55}
.card[disabled]:hover{transform:none}


.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* SEPA speaking progress */
.progwrap{display:flex;flex-direction:column;gap:22px}
.jcard{position:relative;border-radius:24px;background:var(--surface);border:1.5px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}
.jcard .ex{position:absolute;top:14px;right:14px;background:var(--ysoft)}
.jchart{width:100%;max-width:560px;height:auto;align-self:center}
.jchart .jt{font:700 11px var(--f-body);fill:var(--muted)}
.jchart .jt.goal{fill:var(--green)}
.jchart .jx{font:800 12px var(--f-body);fill:var(--ink)}
.stops{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stop{border-radius:16px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.stop small{color:var(--muted);font-weight:700;font-size:12px}
.stop b{font-size:14px;line-height:1.3}
.stop.soon{background:transparent;border:1.5px dashed var(--line)}
.lvchip{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}
.lvchip.l0{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.lvchip.l1{background:var(--ysoft);color:var(--ink)}
.lvchip.l2{background:color-mix(in srgb,var(--good) 22%,var(--surface));color:var(--good)}
.lvchip.l3{background:var(--deep);color:var(--on-deep)}
.lvnone{color:var(--muted);font-weight:700;font-size:13px}
table.bd{width:100%;border-collapse:collapse;font-size:14px;min-width:440px}
table.bd th,table.bd td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.bd thead th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.bd tbody th{font-weight:700}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:800;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration-color:var(--green)}
.fb{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fb > div{border-radius:16px;background:var(--surface);border:1.5px solid var(--line);padding:12px 14px;min-width:0}
.fb small{color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:4px 0 0}
.pgform{display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;min-width:0}
.field select,.field input,.field textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;width:100%}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--green);outline:none}
.ovl{margin:0;font-weight:700}
.savebtn{--sbg:var(--deep);--sfg:var(--on-deep);background:var(--deep);color:var(--on-deep)}
.savebtn[disabled]{opacity:.6}
.pgstatus{font-weight:700;font-size:14px;color:var(--muted);margin:0}
.addp{display:flex;flex-direction:column;gap:10px}


/* ===== SEPA app layer: phone-app flow (home tiles, topic lists with rings, phrase episodes) ===== */
:root{ --track:#E3EFD9; --skin:#F2C5A0; --hair:#3A2A1E; --on-green:#FFFFFF; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --track:#26331F; --skin:#D9A982; --hair:#1A120C; --on-green:#10150E; }}
:root[data-theme="dark"]{ --track:#26331F; --skin:#D9A982; --hair:#1A120C; --on-green:#10150E; }

.app{max-width:640px;margin:0 auto;padding-block:12px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.logo{display:block;height:30px;width:auto;max-width:60%}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--line)}
.title{font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.12;margin:0;text-align:center;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;text-align:center;font-weight:600}
.pagebar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:6px}
.pagebar .title{font-size:clamp(22px,6vw,30px)}
.h2{margin:0;font-size:21px;font-weight:800;line-height:1.2}
.lead{margin:0;color:var(--muted)}

/* ring */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* home */
.hello{margin:6px 0 0}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sumc{border-radius:22px;background:var(--surface);border:1.5px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.sumc > b{font-weight:800;font-size:16px;margin-top:6px}
.sumc small{color:var(--muted);font-weight:700;font-size:13px}
.sumc .lvchip{font-size:15px}
.tile.wide{grid-column:1 / -1;flex-direction:row;min-height:0;text-align:left;justify-content:flex-start;gap:14px;padding:12px 14px}
.tile.wide .ill{max-width:110px;flex:none}
.tile.wide .wt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.tile.wide .num{position:static}
.tile.locked .ill{filter:grayscale(1);opacity:.55}
.lockline{display:inline-flex;align-items:center;gap:6px}
.lockic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--track);color:var(--muted);display:grid;place-items:center}
.rowi.locked{cursor:default;opacity:.6}
.rowi.locked .thumb{filter:grayscale(1)}
.lockbox{border-radius:24px;background:var(--surface);border:1.5px dashed var(--line);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lockbox > svg{width:34px;height:34px;color:var(--muted)}
.lockbox b{font-size:19px}
.lockbox p{margin:0;color:var(--muted);max-width:44ch}
.nextbox > span > svg{vertical-align:-4px;margin-right:6px}
.today{display:flex;align-items:center;gap:20px}
.today h2{margin:0;font-size:21px;font-weight:800}
.today p{margin:2px 0 4px;color:var(--muted)}
.linky{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:800;cursor:pointer;color:var(--ink)}
.goalpick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:-8px}
.band{background:var(--green);border-radius:32px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{position:relative;border:0;background:var(--surface);border-radius:22px;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:center;min-height:196px;color:var(--ink);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ill{width:100%;max-width:120px;height:auto}
.tile b{font-size:16px;font-weight:800;line-height:1.2;text-wrap:balance}
.tile small{color:var(--muted);font-weight:700;font-size:13px}
.tile .num{position:absolute;top:10px;left:12px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.06em}
.tile.soon .ill{opacity:.55}
.bar{width:80%;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--ysoft);color:var(--ink);font-weight:800;font-size:12px}
.cont{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.cont:hover{border-color:var(--green)}
.cont span.t{flex:1;min-width:0}
.cont small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.cont b{display:block;font-weight:800}

/* tabs + chips */
.tabs{display:flex;gap:22px;justify-content:center}
.tab{border:0;background:none;padding:4px 0;font-size:18px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:color-mix(in srgb,var(--green) 10%,var(--surface))}

/* lists */
.rows{display:flex;flex-direction:column;gap:12px}
.rowi{display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.rowi:hover .thumb{border-color:var(--green)}
.thumb{flex:none;width:76px;height:76px;border-radius:18px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--u) 12%,var(--surface));display:grid;place-items:center;color:color-mix(in srgb,var(--u) 75%,var(--ink))}
.thumb svg{width:40px;height:40px}
.rowi .txt{flex:1;min-width:0}
.rowi .txt b{display:block;font-weight:700;font-size:16.5px;line-height:1.3}
.rowi .txt small{display:block;color:var(--muted);font-size:14px}
.ugroup{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.ugroup small{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.ugroup p{margin:0;color:var(--muted);font-size:14.5px}
.nextbox{display:flex;align-items:center;gap:12px;border-radius:20px;background:var(--ysoft);padding:14px 16px;border:0;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.nextbox span{flex:1;min-width:0}
.nextbox b{display:block;font-weight:800}
.nextbox small{display:block;color:var(--muted);font-weight:600}
details.essbox{border-radius:18px;background:var(--surface);border:1.5px dashed var(--line);padding:0 14px}
details.essbox summary{cursor:pointer;padding:12px 0;font-weight:800;list-style:none}
details.essbox summary::-webkit-details-marker{display:none}
details.essbox ul{margin:0 0 14px;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* routine (episode) page */
.hero{display:flex;align-items:center;gap:16px}
.hero .bigthumb{flex:none;width:112px;height:112px;border-radius:50%;background:color-mix(in srgb,var(--u) 14%,var(--surface));display:grid;place-items:center;color:color-mix(in srgb,var(--u) 75%,var(--ink))}
.hero .bigthumb svg{width:58px;height:58px}
.hero h1{margin:0;font-size:clamp(26px,7vw,34px);font-weight:800;line-height:1.1;text-wrap:balance}
.hero small{display:block;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:4px}
.eps{display:flex;flex-direction:column;gap:12px}
.ep{border:1.5px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.ep[open]{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.ep summary{list-style:none;display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer}
.ep summary::-webkit-details-marker{display:none}
.eprng{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:60px}
.eprng small{color:var(--green);font-size:11.5px;font-weight:800}
.eptxt{flex:1;min-width:0}
.eptxt b{display:block;font-weight:700;font-size:16.5px;line-height:1.35}
.eptxt small{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-top:2px}
.ep .chev{flex:none;color:var(--muted);transition:transform .2s}
.ep[open] .chev{transform:rotate(180deg)}
.ep .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--ysoft);color:var(--ink);font-size:15px}
.btn:hover{background:var(--yellow);color:var(--on-y)}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.primary:hover{background:var(--deep);color:var(--on-deep)}
.btn[aria-pressed="true"]{background:var(--deep);color:var(--on-deep)}
.btn[disabled]{opacity:.6;cursor:default}
.btn.wide{justify-content:center;padding:13px 18px;font-size:16px}
.sec{display:flex;flex-direction:column;gap:12px}

/* tasks */
.taskhero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-radius:28px;background:var(--surface);border:1.5px solid var(--line);padding:20px 16px}
.taskhero .ill{width:150px;height:auto}
.taskhero h1{margin:0;font-size:30px;font-weight:800}
.taskhero p{margin:0;max-width:52ch}
.done-tag{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:800}

/* me */
.card{border-radius:22px;background:var(--surface);border:1.5px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:19px;font-weight:800}
.who{display:flex;align-items:center;gap:14px}
.avatar{flex:none;width:60px;height:60px;border-radius:50%;background:var(--yellow);color:var(--on-y);display:grid;place-items:center;font-weight:800;font-size:22px}
.who b{display:block;font-size:20px;font-weight:800}
.who small{color:var(--muted);font-weight:700}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.prow .bar{width:100%;grid-column:1 / -1}
.prow b{font-weight:700}
.prow span{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.bigl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bigl .lvchip{font-size:18px;padding:4px 14px}
.notice{border-radius:14px;background:var(--ysoft);padding:10px 12px;font-size:14.5px}
.linkrow{display:flex;align-items:center;gap:12px;border:0;background:none;padding:4px 0;cursor:pointer;width:100%;text-align:left;color:var(--ink);font-weight:800}
.linkrow span{flex:1}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--ysoft);color:var(--ink)}

/* illustrations */
.ill .k-g{fill:var(--green)} .ill .k-d{fill:var(--deep)} .ill .k-y{fill:var(--yellow)} .ill .k-s{fill:var(--surface)}
.ill .k-t{fill:var(--track)} .ill .k-sk{fill:var(--skin)} .ill .k-h{fill:var(--hair)} .ill .k-i{fill:var(--ink)} .ill .k-b{fill:var(--u3)}
.ill .o{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ill .ow{fill:none;stroke:var(--surface);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ill text{font-family:var(--f-body);font-weight:800}

/* bottom nav (app tab bar) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-weight:800;font-size:11.5px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--green)}
@media (max-width:380px){.tile{min-height:176px}.thumb{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){.tile,.ep .chev{transition:none}}

/* revert to the hub's original look: Oswald display, coloured header blocks, topic list */
.title{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(28px,7vw,38px);line-height:1.05}
.h2{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.15}
.card h2{font-family:var(--f-display);font-weight:600;font-size:21px}
.back{border:0;background:none;display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);cursor:pointer;padding:4px 0;align-self:flex-start}
.back svg{width:16px;height:16px}
.back:hover{color:var(--ink)}
.pagehead{border-radius:28px;padding:22px 24px;background:color-mix(in srgb,var(--u),#000 var(--shade));color:#fff;display:flex;flex-direction:column;gap:8px}
.pagehead .k{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.pagehead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.02;margin:0;text-transform:uppercase;text-wrap:balance}
.pagehead p{margin:0;max-width:62ch;opacity:.95}
.pagehead .phmeta{font-weight:800;font-size:14px}
.tlist{display:flex;flex-direction:column;gap:12px}
.tcard{border:0;border-radius:24px;padding:18px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--u),#000 var(--shade));color:#fff;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .num{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;opacity:.9}
.tcard h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.tcard p{margin:0;opacity:.92}
.tcard .tbar{display:flex;align-items:center;gap:10px;margin-top:6px}
.tcard .tbar .bar{flex:1;width:auto;height:8px;background:rgba(255,255,255,.28)}
.tcard .tbar .bar i{background:var(--yellow)}
.tcard .tbar b{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.tcard .tag{align-self:flex-start;margin-top:6px;background:rgba(255,255,255,.92);color:#16210F}
.tcard.locked{background:color-mix(in srgb,var(--u) 35%,var(--muted))}
.tcard .lockline{display:inline-flex;align-items:center;gap:6px;font-weight:800;margin-top:6px}
.tcard.soon{background:color-mix(in srgb,var(--u) 55%,var(--muted))}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.taskc{border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;cursor:pointer;color:var(--ink)}
button.taskc:hover{border-color:var(--green)}
.taskc .k{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.1}
.taskc .tic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ysoft);color:var(--ink)}
.taskc p{margin:0;font-size:15px}
.taskc.soon{border-style:dashed;color:var(--muted);cursor:default}
.ctag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--ysoft);color:var(--ink);vertical-align:1px}
.pagehead .ctag.on{background:var(--yellow);color:var(--on-y);margin-right:6px}
.thumb svg{width:40px;height:40px}
.cont .thumb svg{width:26px;height:26px}
@media (prefers-reduced-motion:reduce){.tcard{transition:none}}

.skchips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.skchips > div{border-radius:14px;background:var(--bg);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.skchips small{color:var(--muted);font-weight:800;font-size:11.5px}
.skchips .lvchip{font-size:12px;padding:2px 8px}
@media (max-width:380px){.skchips{grid-template-columns:repeat(2,minmax(0,1fr))}}
table.bd tr.totrow th, table.bd tr.totrow td{background:var(--ysoft)}
table.bd tr.subrow th{font-weight:600;font-size:13px;color:var(--muted);padding-left:20px}
.sumc .lvnone{font-size:13px}

.result.locked{cursor:default;opacity:.6}
.result .done-tag{flex:none}
.tasks .taskc .ctag{align-self:flex-start}

/* quizzes + submissions */
.quiz{gap:14px}
.qgroup{display:flex;flex-direction:column;gap:12px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);padding:16px}
.qgroup audio{width:100%;height:44px}
.passage{border-radius:14px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px;white-space:pre-wrap}
.passage p{margin:0}
fieldset.qq{border:0;margin:0;padding:12px 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
fieldset.qq legend{font-weight:800;line-height:1.4;padding:0;margin-bottom:6px;display:flex;gap:8px}
.qn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ysoft);display:grid;place-items:center;font-size:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--green)}
.opt input{margin-top:4px;accent-color:var(--green);flex:none}
.opt:has(input:checked){border-color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--surface))}
fieldset.qq .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
fieldset.qq .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
fieldset.qq input[disabled] + span{color:var(--ink)}
.qfb{margin:0;font-weight:800;font-size:14px}
fieldset.ok .qfb{color:var(--good)}
fieldset.no .qfb{color:var(--bad)}
.qerr{margin:6px 0 0;color:var(--bad);font-weight:800;font-size:14px}
.qerr:empty{display:none}
.scorebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:20px;background:var(--ysoft);padding:14px 16px}
.scorebox b{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.scorebox span{flex:1;min-width:140px;font-weight:700}
.subcard{display:flex;flex-direction:column;gap:6px;border-radius:16px;background:color-mix(in srgb,var(--good) 10%,var(--surface));padding:12px 14px}
.subcard b{display:inline-flex;align-items:center;gap:6px;color:var(--good)}
.subcard small{color:var(--muted);font-weight:700}
.subcard audio,.rmedia audio{width:100%;height:40px}
.filebtn{position:relative;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--st);outline-offset:2px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.rrow:first-of-type{border-top:0}
.rrow .rv{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.rmedia{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px}
.rmedia a{font-weight:800;color:var(--ink)}
.wtext{white-space:pre-wrap;margin:0 0 12px}

.twist{border-radius:20px;background:var(--ysoft);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.twist small{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.twist b{font-size:18px}
.twist .linky{align-self:flex-start;margin-top:4px}
details.utask{border:1.5px solid var(--line);border-radius:18px;background:var(--surface);padding:0 12px}
details.utask summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 2px}
details.utask summary::-webkit-details-marker{display:none}
details.utask summary > span:first-child{flex:1;min-width:0}
details.utask summary b{display:block;font-weight:800}
details.utask summary small{display:block;color:var(--muted);font-weight:700;font-size:13px}
details.utask .list{padding-bottom:12px}
fieldset.qq .btn{margin-bottom:2px}

.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks li::before{content:"";flex:none;width:18px;height:18px;margin-top:3px;border-radius:5px;border:2px solid var(--green)}

/* ===== Sparks brand palette (dark green, medium green, light, white, orange) ===== */
:root{
  --bg:#FDFFF6; --surface:#FFFFFF; --ink:#103718; --muted:#526653; --line:#E1EBCF;
  --green:#07621C; --deep:#103718; --on-deep:#FDFFF6; --yellow:#F09319; --ysoft:#F4FFC2; --on-y:#103718;
  --orange:#F09319; --light:#F4FFC2; --soon:#6B7A6C; --track:#E3F0C7; --on-green:#FDFFF6; --good:#07621C; --bad:#C2412D;
  --u1:#07621C; --u2:#B86A00; --u3:#103718; --u4:#2F7A3B; --u5:#8A5A00; --u6:#245233; --st:#F09319;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D170F; --surface:#15241A; --ink:#EEF7DE; --muted:#A6B9A3; --line:#28392B;
  --green:#4FB861; --deep:#1D5A2A; --on-deep:#FDFFF6; --yellow:#F09319; --ysoft:#2B3A18; --on-y:#103718;
  --orange:#F5A43C; --light:#2B3A18; --soon:#56645A; --track:#223421; --on-green:#0D170F; --good:#6CCB7B; --bad:#F07A63;
  --u1:#4FB861; --u2:#F5A43C; --u3:#7FC98A; --u4:#5DB46B; --u5:#E3A24A; --u6:#8BC995; --st:#F5A43C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D170F; --surface:#15241A; --ink:#EEF7DE; --muted:#A6B9A3; --line:#28392B;
  --green:#4FB861; --deep:#1D5A2A; --on-deep:#FDFFF6; --yellow:#F09319; --ysoft:#2B3A18; --on-y:#103718;
  --orange:#F5A43C; --light:#2B3A18; --soon:#56645A; --track:#223421; --on-green:#0D170F; --good:#6CCB7B; --bad:#F07A63;
  --u1:#4FB861; --u2:#F5A43C; --u3:#7FC98A; --u4:#5DB46B; --u5:#E3A24A; --u6:#8BC995; --st:#F5A43C; color-scheme:dark;
}
.tabbar button[aria-current="page"] svg{color:var(--orange)}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tcard .tbar .bar i{background:var(--orange)}
/* level card */
.lvcard{border-radius:28px;background:var(--light);padding:20px 18px;display:flex;flex-direction:column;gap:12px;border:1.5px solid color-mix(in srgb,var(--green) 18%,transparent)}
.lvl{margin:0;font-weight:800;font-size:17px;color:var(--ink)}
.lvl b{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin-left:4px;color:var(--green)}
.tipl{margin:0;display:flex;gap:8px;align-items:flex-start;font-weight:800;color:var(--ink)}
.tipl svg{flex:none;color:var(--orange);margin-top:3px}
.lvprog{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvprog p{margin:0;font-weight:700}
.lvprog b{font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;color:var(--ink)}
.lvbar{width:100%;height:8px;background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.lvbar i{background:var(--green)}
.curr{display:flex;align-items:center;gap:14px;border:0;background:var(--surface);border-radius:20px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.curr:hover{box-shadow:inset 0 0 0 1.5px var(--green)}
.curr .av{flex:none;width:58px;height:58px;border-radius:50%;background:var(--deep);color:var(--light);display:grid;place-items:center}
.curr .av svg{width:28px;height:28px}
.curr .cx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.chipc{display:inline-block;border-radius:12px;background:var(--light);color:var(--green);font-weight:800;font-size:13px;padding:4px 12px}
.curr b{font-weight:800;font-size:16px;line-height:1.3}
/* daily challenges */
.rowhead2{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.linky2{border:0;background:none;padding:0;font-weight:800;color:var(--green);cursor:pointer;font-size:15px}
.chrow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.chal{flex:0 0 min(78%,300px);scroll-snap-align:start;border:0;border-radius:24px;background:color-mix(in srgb,var(--green) 12%,var(--surface));padding:18px;text-align:left;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-height:172px}
.chal::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--orange) 22%,transparent)}
.chal > *{position:relative;z-index:1}
.chal:hover{box-shadow:inset 0 0 0 1.5px var(--green)}
.chal.done{background:color-mix(in srgb,var(--green) 20%,var(--surface))}
.chal.locked{cursor:default;background:var(--surface);border:1.5px dashed var(--line);color:var(--muted)}
.chal.locked::after{display:none}
.chtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chtop b{font-family:var(--f-display);font-weight:700;font-size:24px}
.chal small{color:var(--muted);font-weight:700;font-size:14px}
.cht{margin:0;font-weight:800;font-size:18px;line-height:1.3;flex:1}
.chdiff{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.bolts{display:inline-flex;gap:6px}
.bolts span{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--orange)}
.chal.locked .bolts span{background:var(--bg)}
.chlist{display:flex;flex-direction:column;gap:12px}
.chlist .chal{flex:none;min-height:0}
.learned{margin:0;display:flex;align-items:center;gap:10px;font-weight:700;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);padding:12px 14px}
.learned svg{flex:none;color:var(--orange)}
.learned b{font-family:var(--f-display);font-weight:700;font-size:20px}
.tcard.locked{background:color-mix(in srgb,var(--u) 55%,#34423A)}
.tcard.soon{background:#4E5B51}
.curr .av{color:#F4FFC2}
/* type: Plus Jakarta Sans, falling back to SF Pro on Apple devices */
:root{--f-display:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;--f-body:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
.title,.pagehead h2,.tcard h3{font-weight:800;letter-spacing:-.015em}
.h2,.card h2,.taskc .k{font-weight:700;letter-spacing:-.01em}
.lvl b,.lvprog b,.chtop b,.learned b,.scorebox b,.rrow .rv,.tcard .tbar b,.tcard .num{font-weight:800}
/* swipeable daily challenge: one card at a time */
.chrow{gap:0;padding:0;scrollbar-width:none;border-radius:24px}
.chrow::-webkit-scrollbar{display:none}
.chrow .chal{flex:0 0 100%;min-height:180px}
.chdots{display:flex;justify-content:center;gap:6px;margin-top:-2px}
.chdots span{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s,background .2s}
.chdots span.on{width:22px;background:var(--green)}
.chhint{margin:-6px 0 0;text-align:center;color:var(--muted);font-size:13px;font-weight:600}
@media (prefers-reduced-motion:reduce){.chdots span{transition:none}}
/* ===== revised palette: primary green, secondary blue, navy-to-green linear, dark text ===== */
:root{
  --bg:#F7F9F4; --surface:#FFFFFF; --ink:#121826; --muted:#5B6474; --line:#E4E8EE;
  --primary:#8BC157; --green:#4B8A1E; --blue:#0056E2; --navy:#0B2A6F; --deep:#0B2A6F; --on-deep:#FFFFFF;
  --yellow:#8BC157; --on-y:#121826; --ysoft:#EEF7E3; --light:#EEF7E3; --orange:#0056E2; --soon:#5A6478;
  --track:#E3EEDA; --on-green:#FFFFFF; --good:#3F7D16; --bad:#C2412D; --st:#0056E2;
  --u1:#0056E2; --u2:#4B8A1E; --u3:#0B2A6F; --u4:#2C7D5E; --u5:#1E63C9; --u6:#5E8F2B;
  --linear:linear-gradient(135deg,#0B2A6F 0%,#1B4C97 48%,#6FAD3A 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151C2C; --ink:#EEF2F8; --muted:#A3ACBC; --line:#26304A;
  --primary:#8BC157; --green:#7DBF4C; --blue:#5B93FF; --navy:#1E3F8F; --deep:#1E3F8F; --on-deep:#FFFFFF;
  --yellow:#8BC157; --on-y:#121826; --ysoft:#1E2C1C; --light:#1E2C1C; --orange:#5B93FF; --soon:#3C465C;
  --track:#25331F; --on-green:#0D1220; --good:#8BC157; --bad:#F07A63; --st:#5B93FF;
  --u1:#5B93FF; --u2:#7DBF4C; --u3:#7F9DE0; --u4:#5CC29A; --u5:#6FA2F0; --u6:#9CCB66;
  --linear:linear-gradient(135deg,#0B2A6F 0%,#1B4C97 48%,#5E9A30 100%); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2C; --ink:#EEF2F8; --muted:#A3ACBC; --line:#26304A;
  --primary:#8BC157; --green:#7DBF4C; --blue:#5B93FF; --navy:#1E3F8F; --deep:#1E3F8F; --on-deep:#FFFFFF;
  --yellow:#8BC157; --on-y:#121826; --ysoft:#1E2C1C; --light:#1E2C1C; --orange:#5B93FF; --soon:#3C465C;
  --track:#25331F; --on-green:#0D1220; --good:#8BC157; --bad:#F07A63; --st:#5B93FF;
  --u1:#5B93FF; --u2:#7DBF4C; --u3:#7F9DE0; --u4:#5CC29A; --u5:#6FA2F0; --u6:#9CCB66;
  --linear:linear-gradient(135deg,#0B2A6F 0%,#1B4C97 48%,#5E9A30 100%); color-scheme:dark;
}
/* tab bar: light-green pill on the active tab */
.tabbar{border-top:1px solid var(--line)}
.tabbar button{border-radius:16px;margin:6px 4px;padding:8px 4px}
.tabbar button[aria-current="page"]{background:var(--light);color:var(--green)}
.tabbar button[aria-current="page"] svg{color:var(--green)}
/* level card = balance card */
.lvcard{background:var(--light);border:0}
.lvl b{color:var(--green)}
.lvbar{background:color-mix(in srgb,var(--primary) 22%,var(--surface))}
.lvbar i{background:var(--primary)}
.tipl svg{color:var(--blue)}
.curr .av{background:var(--linear);color:#FFFFFF}
.chipc{background:var(--light);color:var(--green)}
.linky2{color:var(--blue)}
/* daily challenge = gradient banner with ring outlines */
.chal{background:var(--linear);color:#FFFFFF}
.chal::after{background:none;border:16px solid rgba(255,255,255,.16);width:150px;height:150px;right:-50px;top:-55px}
.chal::before{content:"";position:absolute;left:-40px;bottom:-70px;width:140px;height:140px;border-radius:50%;border:14px solid rgba(255,255,255,.10)}
.chal small{color:rgba(255,255,255,.82)}
.chal .chdiff{color:#FFFFFF}
.bolts span{background:rgba(255,255,255,.95);color:var(--blue)}
.chal .done-tag{color:#FFFFFF}
.chal.done{background:var(--linear)}
.chal:hover{box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.chal.locked{background:var(--surface);border:1.5px dashed var(--line);color:var(--muted)}
.chal.locked::before,.chal.locked::after{display:none}
.chal.locked small{color:var(--muted)}
.chal.locked .bolts span{background:var(--bg)}
.chdots span.on{background:var(--primary)}
/* topic cards with soft ring outlines */
.tcard{position:relative;overflow:hidden;background:var(--u)}
.tcard::after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:18px solid rgba(255,255,255,.16);pointer-events:none}
.tcard > *{position:relative;z-index:1}
.tcard .tbar .bar i{background:var(--primary)}
.tcard.locked{background:color-mix(in srgb,var(--u) 55%,#3A4255)}
.tcard.soon{background:#4A5368}
.pagehead{background:color-mix(in srgb,var(--u),#000 var(--shade))}
.learned svg{color:var(--green)}
.btn{background:var(--light);color:var(--ink)}
.btn:hover{background:color-mix(in srgb,var(--primary) 35%,var(--surface));color:var(--ink)}
.btn.primary{background:var(--blue);color:#FFFFFF}
.btn.primary:hover{background:var(--navy);color:#FFFFFF}
.ic{background:var(--light);color:var(--ink)}
.ic:hover,.ic.star[aria-pressed="true"]{background:var(--primary);color:var(--on-y)}
.ctag,.qn,.twist{background:var(--light)}
.scorebox{background:var(--light)}
.tcard{background:color-mix(in srgb,var(--u),#000 var(--shade))}
/* custom swipe: horizontal moves handled in script, vertical page scroll stays native */
.chrow{overflow-x:hidden;scroll-snap-type:none;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.chrow.drag{cursor:grabbing}
.chrow.drag .chal{pointer-events:none}
.chrow:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.chdots button{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);cursor:pointer;transition:width .2s,background .2s}
.chdots button.on{width:22px;background:var(--primary)}
.chdots{align-items:center}
@media (prefers-reduced-motion:reduce){.chdots button{transition:none}}
/* tasks: one collapsible section per topic */
details.ttopic{border-radius:24px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden}
details.ttopic > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px;position:relative;overflow:hidden;background:color-mix(in srgb,var(--u),#000 var(--shade));color:#fff}
details.ttopic > summary::-webkit-details-marker{display:none}
details.ttopic > summary::after{content:"";position:absolute;right:-50px;top:-60px;width:150px;height:150px;border-radius:50%;border:16px solid rgba(255,255,255,.14);pointer-events:none}
details.ttopic > summary > *{position:relative;z-index:1}
details.ttopic .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
details.ttopic .tt small{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
details.ttopic .tt b{font-weight:800;font-size:19px;line-height:1.2}
details.ttopic .ts2{font-weight:700;font-size:13.5px;opacity:.9}
details.ttopic > summary .ring b{color:#fff}
details.ttopic > summary .ring circle:first-child{stroke:rgba(255,255,255,.28)!important}
details.ttopic > summary .lockic{background:rgba(255,255,255,.18);color:#fff}
details.ttopic > summary .chev{flex:none;transition:transform .2s;color:#fff}
details.ttopic[open] > summary .chev{transform:rotate(180deg)}
details.ttopic .tbody{padding:14px;display:flex;flex-direction:column;gap:10px}
details.ttopic.locked > summary{background:color-mix(in srgb,var(--u) 55%,#3A4255)}
details.ttopic.soon > summary{background:#4A5368}
details.utask.locked summary b{color:var(--muted)}
@media (prefers-reduced-motion:reduce){details.ttopic > summary .chev{transition:none}}

/* account + review */
.avbtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--linear);color:#fff;font-weight:800;cursor:pointer;display:grid;place-items:center}
.top{gap:8px}.top .logo{margin-right:auto}
.acct .who{display:flex;align-items:center;gap:14px}
.acct .who > div{display:flex;flex-direction:column;gap:1px;min-width:0}

.acct [data-myemail]{color:var(--muted);font-weight:600;word-break:break-all}
.acct .role{align-self:flex-start;margin-top:4px;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--light);color:var(--green)}

/* ===== sign-in / welcome ===== */

@media (min-width:860px){.auth{grid-template-columns:1fr 440px;align-items:start;padding-top:48px}.authhero{grid-row:1 / span 2}.authalt{grid-column:2}}
.authhero{background:var(--linear);color:#fff;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;gap:12px}

.lvpick{display:flex;gap:8px;flex-wrap:wrap}

.lvopt span{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:7px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}

.rbdesc p{margin:0}
.rbdl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.rbhint{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.rbrange{font-size:13px;font-weight:700;color:var(--muted)}
.rbcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:4px 0 14px}
.rbcol{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--bg)}
.rbcol .lvchip{align-self:flex-start}
.rbcol .rbdl{font-size:14px;line-height:1.45}
.tgts{display:flex;flex-direction:column;gap:10px}
.tgt{border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tgt.soon{border-style:dashed;opacity:.85}
.tgth{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tgth small{display:block;color:var(--muted);font-weight:800;font-size:12px}
.tgth b{font-weight:800;font-size:15px}
.tgtt{flex:none;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tgsk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tgsk > span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;background:var(--bg);font-weight:800;font-size:14px}
.tgsk > span small{font-weight:700;font-size:11px;color:var(--muted)}
.tgsk > span.ok{background:var(--light);color:var(--green)}
.tgsk svg{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.tgm{margin:0;font-size:13.5px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.tgm svg{width:16px;height:16px;color:var(--green)}

/* ===== score dropdown + visible rubric ===== */
.crit{gap:8px}
.crhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.crhead label{font-weight:800;font-size:15px}
.crhead select{flex:none;min-width:96px;font:inherit;font-weight:800;font-size:15px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.rbrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rbrows li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;line-height:1.45;color:var(--muted)}
.rbrows li b{font-size:15px;font-weight:800;color:var(--ink);text-align:center;background:var(--bg);border-radius:8px;padding:2px 0}
.rbrows li.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--surface));color:var(--ink)}
.rbrows li.on b{background:var(--blue);color:#fff}
.lvchip.score{min-width:28px;text-align:center}

/* ===== review list ===== */
.rvbox{display:flex;flex-direction:column;gap:12px}
.chip b{font-weight:800;color:var(--muted);margin-left:4px}
.rvfilters{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.rvfilters{grid-template-columns:2fr 1fr 1fr}.rvfilters .rvsearch{grid-column:1 / -1}}
@media (min-width:900px){.rvfilters{grid-template-columns:1.6fr repeat(4,1fr)}.rvfilters .rvsearch{grid-column:auto}}
.rvfilters select,.rvsearch{width:100%;box-sizing:border-box;font:inherit;font-size:14.5px;font-weight:600;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.rvsearch{display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted)}
.rvsearch input{border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:9px 0;flex:1;min-width:0}
.rvsearch:focus-within{border-color:var(--blue)}
.rvcount{margin:0;color:var(--muted);font-weight:700;font-size:13.5px}
.rvrows{display:flex;flex-direction:column}
.rvrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 4px;cursor:pointer;color:var(--ink);font:inherit}
.rvrow:first-child{border-top:0}
.rvrow:hover{background:color-mix(in srgb,var(--light) 60%,transparent)}
.rvic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--light);color:var(--green)}
.rvmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rvmain b{font-weight:800;font-size:15.5px}
.rvmain small{color:var(--muted);font-weight:600;font-size:13px}
.rvend{flex:none;display:flex;align-items:center;gap:8px}
.rvpill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.rvpill.todo{background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue)}
.rvpill.re{background:color-mix(in srgb,#E08A1E 18%,var(--surface));color:#9A5408}
.rvpill.done{background:var(--light);color:var(--green)}
.btn.sm{padding:7px 14px;font-size:14px}
@media (max-width:520px){.rvrow{flex-wrap:wrap}.rvend{width:100%;padding-left:50px;justify-content:space-between}}
.rvnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rvnav span{color:var(--muted);font-weight:700;font-size:14px}
.rvnav .btn svg{width:16px;height:16px}
.rvfilters{grid-template-columns:1fr 1fr}
.rvfilters .rvsearch{grid-column:1 / -1}
@media (min-width:560px){.rvfilters{grid-template-columns:repeat(4,minmax(0,1fr))}.rvfilters .rvsearch{grid-column:1 / -1}}
@media (min-width:900px){.rvfilters{grid-template-columns:repeat(4,minmax(0,1fr))}.rvfilters .rvsearch{grid-column:1 / -1}}
@media (max-width:520px){.rvrow{flex-wrap:nowrap;align-items:flex-start}.rvend{width:auto;padding-left:0;flex-direction:column;align-items:flex-end}.rvend .btn{display:none}}

.curr .cx b{font-size:16px}
.curr .cunit{display:block;color:var(--muted);font-weight:600;font-size:13.5px;margin-top:2px}

.ctag.lib{background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue)}

/* ===== notifications ===== */
.bellbtn{position:relative}
.nbadge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.nlist{display:flex;flex-direction:column;padding:6px 14px}
.nrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 2px;cursor:pointer;color:var(--ink);font:inherit}
.nrow:first-child{border-top:0}
.nic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--light);color:var(--green)}
.nic svg{width:20px;height:20px}
.ntx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14.5px}
.ntx b{font-weight:800}
.ntx small{color:var(--muted);font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:center}
.nrow.unread .ntx > span{font-weight:700}
.ndot{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,var(--surface));color:var(--blue)}
/* ===== my trainer ===== */
.mytr,.trform{display:flex;flex-direction:column;gap:12px}
.mytr .who{display:flex;gap:12px;align-items:center}
.mytr .who > div{display:flex;flex-direction:column;min-width:0}
.mytr .who b{font-weight:800;font-size:17px}
.mytr .who small{color:var(--muted);font-weight:600}
.trrow{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--bg)}
.trrow small{color:var(--muted);font-weight:800;font-size:12px}
.trval{font-weight:700;word-break:break-all;user-select:all}
.trline{margin:-4px 0 0}
/* ===== practise speaking ===== */
.spcard{display:flex;flex-direction:column;gap:14px}
.psteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.psteps li{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.psteps li::marker{font-weight:800;color:var(--green)}
.psteps b{font-weight:800}
.psteps p{margin:0;color:var(--muted);font-size:14px}
.psteps audio{width:100%;max-width:420px;height:40px}
.redo{display:flex;flex-wrap:wrap;gap:6px}
.redo .chip{font-size:13px;font-weight:600;text-align:left}
.spk .h2 .ctag{vertical-align:3px;margin-left:6px}
.spk .h2 .ctag svg{width:12px;height:12px;vertical-align:-1px}
.trval{word-break:normal;overflow-wrap:anywhere}

/* ===== daily phrase review ===== */
.drill{display:flex;flex-direction:column;gap:10px}
.dcard{display:flex;flex-direction:column;gap:8px}
.dcard small{color:var(--muted);font-weight:700;font-size:12.5px}
.dph{margin:0;font-size:18px;font-weight:700;line-height:1.4}
.dcard.ok{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.dcard .acts{align-items:center}

/* ===== content editor ===== */
.cebox{display:flex;flex-direction:column;gap:12px}
.cebox textarea,.cebox input[type=text],.cebox select{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.cebox textarea{line-height:1.5;resize:vertical}
.cenote{margin:0;color:var(--muted);font-size:13.5px;font-weight:600}
.cegroup{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.cegroup legend{font-weight:800;padding:0 6px}
.ceq{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.ceqh{display:flex;justify-content:space-between;align-items:center}
.cesave{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);padding:10px 0 4px;border-top:1.5px solid var(--line)}

/* ===== unit journey ===== */
.ucards{display:flex;flex-direction:column;gap:10px}
.ucard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:12px 14px;cursor:pointer}
.ucard.now{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 25%,transparent)}
.ucard.wait{opacity:.8}
.ucard .thumb{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--u);color:#fff}
.ucard .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ucard .txt small{color:var(--muted);font-weight:800;font-size:12px}
.ucard .txt b{font-weight:800;font-size:16px}
.umeta{display:flex;gap:10px;color:var(--muted);font-size:13px;font-weight:600}
.ubadge{flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.ubadge svg{width:13px;height:13px}
.ubadge.done{background:var(--light);color:var(--green)}
.ubadge.now{background:var(--blue);color:#fff}
@media (max-width:440px){.ucard{flex-wrap:wrap}.ucard .ubadge{margin-left:58px}}
.ustep{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ustep li{display:flex;gap:8px;align-items:center;padding:10px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);min-width:0}
.ustep li > span:last-child{display:flex;flex-direction:column;min-width:0}
.ustep b{font-size:13.5px;font-weight:800;line-height:1.2}
.ustep small{font-size:12px;color:var(--muted);font-weight:600}
.ustep li.cur{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--surface))}
.un{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg);color:var(--muted)}
.un svg{width:15px;height:15px}
li.cur > .un,.ustage.cur .un{background:var(--blue);color:#fff}
li.done > .un{background:var(--green);color:#fff}
@media (max-width:460px){.ustep li{flex-direction:column;align-items:flex-start;gap:4px;padding:8px}}
.ustage{display:flex;flex-direction:column;gap:12px}
.ustage.cur{border-color:var(--blue)}
.ustage.off{opacity:.75}
.ushead{display:flex;gap:10px;align-items:flex-start}
.ushead > div{display:flex;flex-direction:column;gap:2px}
.ushead b{font-weight:800;font-size:16px}
.ushead small{color:var(--muted);font-weight:600;font-size:13.5px}
.rowi.next{border-color:var(--blue)}
.lstat{flex:none;font-size:12.5px;font-weight:800;color:var(--blue);padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--blue) 10%,var(--surface))}
.nextstep{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);margin-top:8px}
.nextstep p{margin:0;color:var(--muted)}
.nextstep b{font-weight:800;display:inline-flex;gap:6px;align-items:center}
.nextstep b svg{width:16px;height:16px}
.nextstep.ok{border-color:color-mix(in srgb,var(--green) 45%,var(--line));background:color-mix(in srgb,var(--light) 60%,var(--surface))}
.nextstep.ok > b{color:var(--green)}
.nextstep.big > b{font-size:19px}
.nextstep .btn{margin-top:4px}
.tstep{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tstep button{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tstep li.cur button{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--surface))}
.umeta{flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:2px}
.ucard > svg{flex:none;color:var(--muted)}
@media (max-width:440px){.ucard{flex-wrap:nowrap}.ucard .ubadge{margin-left:0}}

/* ===== Apps Script additions ===== */
.errbar{position:sticky;top:0;z-index:99;margin:0;padding:12px 16px;background:var(--bad);color:#fff;font-weight:700;font-size:14.5px}
.pchecks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pchecks li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--bg);font-size:14.5px;line-height:1.4}
.pchecks li .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:var(--soon)}
.pchecks li.ok .st{background:var(--good)}
.pchecks li.bad .st{background:var(--bad)}
.pchecks li.warn .st{background:#C98A00}
.pchecks li b{display:block}
a.btn{text-decoration:none}
.pchecks li small{display:block;color:var(--muted);font-weight:600;overflow-wrap:anywhere}
</style>

/* never fail silently: any script error appears as a red bar at the top */
var SEPA_ERRORS = [];

  bar.textContent = 'Something went wrong: ' + SEPA_ERRORS[0] + (SEPA_ERRORS.length > 1 ? '  (+' + (SEPA_ERRORS.length - 1) + ' more: ' + SEPA_ERRORS.slice(1, 3).join(' | ') + ')' : '');
}
