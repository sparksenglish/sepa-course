  var S = { me: null, boot: null, appLoaded: false, web: !!WEB, offline: false, stats: {} };
  var AUTH = { step: 'signin' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDrop(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function normEmail(v) { return String(v || '').trim().toLowerCase(); }

  /* every call goes through api(action, token, payload) */
  // Safe to send twice: these only read. They are retried once after a network hiccup.
  var RETRY = { start: 1, code: 1, course: 1, content: 1, sync: 1, dbGet: 1, profiles: 1, file: 1, contentRows: 1, warmRows: 1, search: 1 };
  function stat(action, total, server) {
    var s = S.stats[action] || (S.stats[action] = { n: 0, first: null, total: 0, server: 0 });
    s.n++; s.total += total; s.server += server || 0;
    if (s.first == null) s.first = total; else s.last = total;
  }
  function callOnce(action, payload) {
    var t0 = Date.now();
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) {
          stat(action, Date.now() - t0, r && r.ms);
          if (r && r.ok) return resolve(r.data);
          if (r && r.code === 'signin' && S.me) { lsDrop(TOKEN_KEY); lsDrop(BOOT_KEY); S.me = null; AUTH = { step: 'signin', msg: 'Please sign in again.' }; showSignIn(); }
          var e = new Error(r && r.error || 'No answer from the server.'); e.userMessage = true; e.code = r && r.code; reject(e);
        })
        .withFailureHandler(function (err) {
          var m = String(err && err.message || err || ''), e;
          if (/busy|429|too many|quota|limit/i.test(m)) { e = new Error('The course server is busy right now (a Google limit was reached). Wait a minute and try again. Your practice on this device is kept.'); e.code = 'busy'; }
          else { e = new Error((navigator.onLine === false ? 'You are offline. ' : 'Could not reach the server. ') + 'Check your connection and try again.' + (m ? ' (' + m.slice(0, 120) + ')' : '')); e.code = 'network'; }
          e.userMessage = true; reject(e);
        })
        .api(action, lsGet(TOKEN_KEY, ''), payload || {});
    });
  }
  function call(action, payload) {
    return callOnce(action, payload).catch(function (e) {
      if (!RETRY[action] || (e.code !== 'network' && e.code !== 'busy') || navigator.onLine === false) throw e;
      return new Promise(function (r) { setTimeout(r, e.code === 'busy' ? 4000 : 1500); }).then(function () { return callOnce(action, payload); });
    });
  }

  var TOPICS = [
    { n: 1, title: 'Practical Classroom English', small: 'English inside the lesson' },
    { n: 2, title: 'Beyond Classroom English', small: 'English with parents, colleagues, leaders and at centre events' },
    { n: 3, title: 'Professional English Proficiency', small: 'Coming soon' }
  ];
  function heroHTML() {
    var names = S.boot && S.boot.topics;
    if (names) TOPICS.forEach(function (t) { var n = names['topic' + t.n]; if (n) { if (n.title) t.title = n.title; if (n.short) t.small = n.short; } });
    return '<section class="authhero"><span class="k">Welcome to</span><h1 style="display:flex;align-items:center;gap:.3em">' + (window.SEPA_ICON ? '<img alt="" src="' + window.SEPA_ICON + '" style="height:1.15em;width:1.15em;flex:none;margin-top:-.06em">' : '') + 'SEPA Course</h1>' +
      '<p class="lead">Sparks English Proficiency Acceleration Course: the English you need to teach, talk with parents and grow your level.</p>' +
      '<ol class="authtopics">' + TOPICS.map(function (t) { return '<li><span>' + t.n + '</span><div><b>' + esc(t.title) + '</b><small>' + esc(t.small) + '</small></div></li>'; }).join('') + '</ol>' +
      '<p class="authhow">Practise the phrases, finish the four skills tasks in each unit, and your trainer tracks your CEFR level along the way.</p></section>';
  }
  function frame(card) {
    return '<div class="auth">' + heroHTML() + '<section class="card authcard"><img class="logo" src="' + SEPA_LOGO + '" alt="Sparks English" width="170" height="34">' + card + '</section>' +
      '<p class="authalt">SEPA Course · ' + esc(S.boot && S.boot.version || '') + '</p></div>';
  }
  function paint(html) {
    document.body.classList.add('signedout');
    root.innerHTML = html;
    scrollTo(0, 0);
  }

  /* ---------- sign-in screens ---------- */
  function showSignIn() {
    if (S.boot && S.boot.method === 'google' && S.boot.user) {
      return paint(frame('<span class="eyebrow">Signed out</span><h2>Signed in with Google</h2>' +
        '<p class="authsub">Google recognised your Sparks account, <b>' + esc(S.boot.user.email) + '</b>, so you don\'t need a password on this device.</p>' +
        '<div class="authrow"><button type="button" class="btn primary authbtn" data-auth="google">Continue as ' + esc(S.boot.user.name) + '</button></div>'));
    }
    paint(frame(cardHTML()));
    var f = root.querySelector('input:not([type=checkbox])');
    if (f && AUTH.step !== 'signin') f.focus();
  }

  function cardHTML() {
    var a = AUTH, msg = a.msg ? '<p class="authmsg' + (a.ok ? ' ok' : '') + '" role="alert">' + esc(a.msg) + '</p>' : '';
    if (a.step === 'code') return '<span class="eyebrow">' + (a.reset ? 'Reset your password' : 'First sign-in') + '</span><h2>Check your email</h2>' +
      '<p class="authsub">We sent a 6-digit sign-in code to <b>' + esc(a.email) + '</b>. It works for 10 minutes. Check your spam folder if it isn\'t in your inbox.</p>' +
      '<form class="authform" data-form="code"><label class="field"><span>Sign-in code</span><input id="au-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits"></label>' + msg +
      '<div class="authrow"><button class="btn primary authbtn" type="submit">Continue</button><button type="button" class="linkbtn" data-auth="resend">Send a new code</button></div></form>' +
      '<hr><button type="button" class="linkbtn" data-auth="back">Back to sign in</button>';
    if (a.step === 'newpw') return '<span class="eyebrow">' + (a.reset ? 'Reset your password' : 'First sign-in') + '</span><h2>Create your password</h2>' +
      '<p class="authsub">For <b>' + esc(a.email) + '</b>. Use at least 8 characters. You\'ll sign in with this from now on.</p>' +
      '<form class="authform" data-form="newpw"><label class="field"><span>New password</span><input id="au-pw1" type="password" autocomplete="new-password"></label>' +
      '<label class="field"><span>Type it again</span><input id="au-pw2" type="password" autocomplete="new-password"></label>' +
      '<label class="showpw"><input type="checkbox" data-auth-show="1"> Show password</label>' + msg +
      '<div class="authrow"><button class="btn primary authbtn" type="submit">Save and sign in</button></div></form>' +
      '<hr><button type="button" class="linkbtn" data-auth="back">Back to sign in</button>';
    return '<span class="eyebrow">Sparks English Proficiency Acceleration Course</span><h2>Sign in to SEPA</h2>' +
      '<p class="authsub">Use the email your trainer registered for your batch.</p>' +
      '<form class="authform" data-form="signin"><label class="field"><span>Email</span><input id="au-email" type="email" autocomplete="username" value="' + esc(a.email || '') + '" placeholder="name@example.com"></label>' +
      '<label class="field"><span>Password</span><input id="au-pw" type="password" autocomplete="current-password" placeholder="Password"></label>' +
      '<label class="showpw"><input type="checkbox" data-auth-show="1"> Show password</label>' + msg +
      '<div class="authrow"><button class="btn primary authbtn" type="submit">Sign in</button><button type="button" class="linkbtn" data-auth="forgot">Forgot password?</button></div></form>' +
      '<hr><p class="authsub">First time, or no password yet? We\'ll email you a sign-in code, then you create your password.</p>' +
      '<button type="button" class="btn authout" data-auth="code">Email me a sign-in code</button>';
  }

  function authSet(p) { AUTH = Object.assign({}, AUTH, { msg: '', ok: false }, p); showSignIn(); }
  function busy(btn, label) { if (btn) { btn.disabled = true; btn.textContent = label; } }

  function signedIn(r) {
    if (r.token) lsSet(TOKEN_KEY, r.token);
    if (r.ver) S.ver = r.ver;
    S.me = Object.assign({ method: r.method || (r.token ? 'password' : 'google') }, r.user);
    AUTH = { step: 'signin' };
    openApp(true);
  }

  async function authSubmit(form) {
    var f = form.dataset.form, btn = form.querySelector('[type=submit]');
    try {
      if (f === 'signin') {
        var email = normEmail(document.getElementById('au-email').value), pw = document.getElementById('au-pw').value;
        if (!email || !pw) return authSet({ email: email, msg: 'Enter your email and password.' });
        AUTH.email = email; busy(btn, 'Signing in…');
        return signedIn(await call('signIn', { email: email, password: pw }));
      }
      if (f === 'code') {
        var c = document.getElementById('au-code').value.replace(/\D/g, '');
        if (c.length !== 6) return authSet({ msg: 'Type the 6 digits from the email.' });
        busy(btn, 'Checking…');
        var v = await call('verifyCode', { email: AUTH.email, code: c });
        return authSet({ step: 'newpw', ticket: v.ticket });
      }
      if (f === 'newpw') {
        var a = document.getElementById('au-pw1').value, b = document.getElementById('au-pw2').value;
        if (a.length < 8) return authSet({ msg: 'Use at least 8 characters.' });
        if (a !== b) return authSet({ msg: 'The two passwords don\'t match.' });
        busy(btn, 'Saving…');
        return signedIn(await call('setPassword', { ticket: AUTH.ticket, password: a }));
      }
    } catch (err) { authSet({ msg: err.message }); }
  }

  async function authClick(t) {
    var k = t.dataset.auth;
    if (k === 'back') return authSet({ step: 'signin' });
    if (k === 'google') { S.me = Object.assign({ method: 'google' }, S.boot.user); return openApp(true); }
    if (k === 'code' || k === 'forgot' || k === 'resend') {
      var inp = document.getElementById('au-email'), email = inp ? normEmail(inp.value) : AUTH.email;
      if (!email) return authSet({ msg: 'Enter your email first, then we\'ll send the code.' });
      var reset = k === 'forgot' ? true : k === 'resend' ? !!AUTH.reset : false;
      busy(t, 'Sending…');
      try {
        await call('requestCode', { email: email, reset: reset });
        authSet({ step: 'code', email: email, reset: reset, ok: k === 'resend', msg: k === 'resend' ? 'We sent a new code.' : '' });
      } catch (err) { authSet({ email: email, msg: err.message }); }
    }
  }

  /** Called by the app after its own sign-out tidy-up. */
  async function afterSignOut() {
    // forget the device's sign-in first, then tell the server (the page doesn't wait for it)
    var token = lsGet(TOKEN_KEY, '');
    lsDrop(TOKEN_KEY); lsDrop(BOOT_KEY);
    S.me = null; S.ver = null; AUTH = { step: 'signin' };
    if (token) { try { google.script.run.withFailureHandler(function () {}).api('signOut', token, {}); } catch (e) {} }
    showSignIn();
  }

  /* ---------- loading the app (code + course), kept in the browser until they change ---------- */
  function loadingCard(msg) {
    return '<span class="eyebrow">Opening your course</span><h2>Hi' + (S.me && S.me.name ? ', ' + esc(S.me.name.split(' ')[0]) : '') + '</h2>' +
      '<p class="authsub" id="loadmsg">' + esc(msg) + '</p>';
  }
  function loadMsg(m) { var el = document.getElementById('loadmsg'); if (el) el.textContent = m; }

  var PART_NAMES = ['app.js'];
  var CAN_GZ = typeof DecompressionStream === 'function' && typeof Response === 'function';
  async function gunzip(b64) {
    var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return new Response(new Response(u).body.pipeThrough(new DecompressionStream('gzip'))).text();
  }
  // S.ver (from start/sign-in) lets a returning visitor skip the server entirely when nothing has changed
  async function getCode() {
    // website: the app code is a static file next to this page (the service worker keeps it for offline use)
    if (WEB) {
      var res = await fetch(WEB.appUrl, { cache: 'no-cache' }).catch(function () { return null; });
      if (!res || !res.ok) throw new Error('The app could not be downloaded. Check your connection and try again.');
      var txt = await res.text();
      if (!/\/\* END app\.js \*\/\s*$/.test(txt)) throw new Error('The app arrived incomplete. Reload the page.');
      return [txt];
    }
    var have = lsGet(CODE_KEY, null);
    if (have && S.ver && S.ver.code === have.v) return have.parts;
    var r = await call('code', { have: have && have.v, gz: CAN_GZ });
    if (r.same) return have.parts;
    var parts = r.gz ? JSON.parse(await gunzip(r.gz)) : r.parts;
    (r.lens || []).forEach(function (n, i) {
      if (parts[i].length !== n) throw new Error(PART_NAMES[i] + ' arrived incomplete (' + parts[i].length + ' of ' + n + ' characters). Reload the page.');
    });
    lsSet(CODE_KEY, { v: r.v, parts: parts });
    return parts;
  }
  async function getCourse() {
    var have = lsGet(COURSE_KEY, null);
    if (have && S.ver && S.ver.course === have.v) return have.json;
    var r = await call('course', { have: have && have.v, gz: CAN_GZ });
    if (r.same) return have.json;
    var json = r.gz ? await gunzip(r.gz) : r.json;
    if (!lsSet(COURSE_KEY, { v: r.v, json: json })) lsDrop(COURSE_KEY);
    return json;
  }

  async function getContent() {
    var have = lsGet(CONTENT_KEY, null);
    if (have && S.ver && S.ver.content && S.ver.content === have.v) return have;
    try {
      var r = await call('content', { have: have && have.v });
      if (r.same) return have;
      var got = { v: r.v, map: r.map };
      lsSet(CONTENT_KEY, got);
      return got;
    } catch (e) {
      return have || { v: null, map: {} };   // the course still opens with the original text
    }
  }

  async function openApp(fresh) {
    if (S.appLoaded) { window.SEPA_START(fresh); return; }
    paint(frame(loadingCard('Loading lessons and your progress…')));
    try {
      var got = await Promise.all([getCode(), getCourse(), getContent()]);
      loadMsg('Almost there…');
      window.__D = JSON.parse(got[1]);
      if (!window.__D.UT || !window.__D.RUB) { lsDrop(COURSE_KEY); throw new Error('course.json in Drive › SEPA Course › Content is an older version. Upload the new course.json (from the sepa-course-src repo, drive folder).'); }
      window.__CONTENT = got[2].map || {}; window.__CONTENT_V = got[2].v;
      // 1. check each part on its own, so a damaged file is named exactly
      for (var i = 0; i < got[0].length; i++) {
        if (!PART_NAMES[i]) { lsDrop(CODE_KEY); throw new Error('The app code is from an older version. Reload the page.'); }
        try { new Function(got[0][i]); }
        catch (e) {
          if (e instanceof SyntaxError) { lsDrop(CODE_KEY); throw new Error(PART_NAMES[i] + ' could not run (' + e.message + '). Upload it again into Drive › SEPA Course › Content, or run checkInstall in the Apps Script editor.'); }
        }
      }
      // 2. run all parts together inside one private scope, so their names can't clash with the scripts Google adds to this page
      var runErr = null, onErr = function (e) { if (!runErr) runErr = e.message || 'script error'; };
      window.addEventListener('error', onErr);
      var s = document.createElement('script');
      s.textContent = '(function () {\n' + got[0].join('\n') + '\n})();\n//# sourceURL=sepa-app.js';
      document.body.appendChild(s);
      window.removeEventListener('error', onErr);
      if (runErr && typeof window.SEPA_START !== 'function') { lsDrop(CODE_KEY); S.ver = null; throw new Error('The app code could not start: ' + runErr); }
      if (typeof window.SEPA_START !== 'function') throw new Error('The app code did not load completely. Reload the page; if it happens again, tell the course admin.');
      S.appLoaded = true;
      window.SEPA_START(fresh);
    } catch (err) {
      paint(frame('<span class="eyebrow">Opening your course</span><h2>Can\'t open the course right now</h2><p class="authmsg" role="alert">' + esc(err.message) + '</p>' +
        '<div class="authrow"><button type="button" class="btn primary authbtn" data-auth-retry="1">Try again</button></div>'));
    }
  }

  /* ---------- events (only while the app isn't loaded; afterwards the app routes these to authSubmit / authClick) ---------- */
  document.addEventListener('submit', function (e) {
    if (S.appLoaded) return;
    var f = e.target.closest('form[data-form]'); if (f) { e.preventDefault(); authSubmit(f); }
  });
  document.addEventListener('click', function (e) {
    var r = e.target.closest('[data-auth-retry]'); if (r) { e.preventDefault(); return openApp(false); }
    if (S.appLoaded) return;
    var t = e.target.closest('[data-auth]'); if (t) { e.preventDefault(); authClick(t); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.dataset && e.target.dataset.authShow) root.querySelectorAll('.auth input[type=password], .auth input[data-pw]').forEach(function (i) { i.dataset.pw = 1; i.type = e.target.checked ? 'text' : 'password'; });
  });

  /* ---------- start: one short call checks the sign-in; offline, the last good one is used ---------- */
  call('start', {}).then(function (r) {
    S.boot = r;
    S.ver = r.ver || null;
    if (r.user) {
      S.me = Object.assign({ method: r.method }, r.user);
      lsSet(BOOT_KEY, { user: r.user, method: r.method, ver: r.ver, topics: r.topics, version: r.version, support: r.support, link: r.link, at: Date.now() });
      return openApp(false);
    }
    lsDrop(BOOT_KEY);
    showSignIn();
  }).catch(function (err) {
    var b = lsGet(BOOT_KEY, null);
    if (err.code === 'network' && b && b.user && lsGet(TOKEN_KEY, '')) {
      // offline (or the server can't be reached): open from what this device already has
      S.offline = true; S.boot = b; S.ver = b.ver || null;
      S.me = Object.assign({ method: b.method }, b.user);
      return openApp(false);
    }
    paint(frame('<h2>Can\'t open SEPA right now</h2><p class="authmsg" role="alert">' + esc(err.message) + '</p>' +
      '<div class="authrow"><button type="button" class="btn primary authbtn" onclick="location.reload()">Try again</button></div>'));
  });

  S.call = call;
  S.esc = esc;
  S.showSignIn = showSignIn;
  S.authSubmit = authSubmit;
  S.authClick = authClick;
  S.afterSignOut = afterSignOut;
  return S;
})();
</script>

</body>
</html>
